<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>投稿パック 2026-12-21｜VX</title>
<style>
body{margin:0;background:#0a0a0b;color:#f2f2f2;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;line-height:1.6}
main{max-width:560px;margin:0 auto;padding:20px 16px 80px}
h1{font-size:20px;margin:0 0 6px}
.how{font-size:14px;color:#bbb;margin:0 0 20px;padding:12px 14px;border-left:3px solid #d4ff2a;background:rgba(212,255,42,.06)}
.card{border:1px solid #2a2a2e;border-radius:14px;padding:14px;margin:0 0 18px}
.meta{margin:0 0 6px;font-size:14px}.meta span{color:#aaa}
.target{margin:0 0 10px;font-size:13px;color:#bbb}
.media{display:grid;gap:6px;grid-template-columns:repeat(3,1fr)}
.media.reel,.media.image{grid-template-columns:1fr}
figure{margin:0}img,video{width:100%;border-radius:8px;display:block;background:#111}
.dl{display:inline-block;margin-top:6px;font-size:13px;color:#d4ff2a}
.todo{margin:10px 0 0;padding-left:18px;font-size:13px;color:#d4ff2a}
textarea{width:100%;box-sizing:border-box;min-height:150px;margin-top:10px;background:#141416;color:#eee;border:1px solid #2a2a2e;border-radius:8px;padding:10px;font-size:14px}
button{margin-top:8px;width:100%;padding:12px;border:0;border-radius:10px;background:#e8e2d6;color:#111;font-weight:700;font-size:15px}
button.save{background:#d4ff2a}
</style></head><body><main>
<h1>投稿パック 2026-12-21〜</h1>
<p class="how">① 「写真アプリに保存」を押す →「画像を保存」／「ビデオを保存」（まとめて写真アプリに入ります）<br>② 「キャプションをコピー」を押す<br>③ Instagramで投稿（黄色の文字は、投稿のときに手でやること）</p>
<section class="card">
  <p class="meta"><b>1. 12/23（水）21:00</b>　カルーセル　<span>@vx.apparel.official</span></p>
  <p class="target">狙い：細部（生地・リフレクティブ・スリット・ウエスト）で価格に納得してもらい、商品ページへ。</p>
  <div class="media carousel"><figure><a href="../2026-12-21/details-01.jpg" target="_blank"><img src="../2026-12-21/details-01.jpg" alt="" loading="lazy"></a></figure><figure><a href="../2026-12-21/details-02.jpg" target="_blank"><img src="../2026-12-21/details-02.jpg" alt="" loading="lazy"></a></figure><figure><a href="../2026-12-21/details-03.jpg" target="_blank"><img src="../2026-12-21/details-03.jpg" alt="" loading="lazy"></a></figure><figure><a href="../2026-12-21/details-04.jpg" target="_blank"><img src="../2026-12-21/details-04.jpg" alt="" loading="lazy"></a></figure><figure><a href="../2026-12-21/details-05.jpg" target="_blank"><img src="../2026-12-21/details-05.jpg" alt="" loading="lazy"></a></figure><figure><a href="../2026-12-21/details-06.jpg" target="_blank"><img src="../2026-12-21/details-06.jpg" alt="" loading="lazy"></a></figure></div>
  <button class="save" data-files='[&quot;../2026-12-21/details-01.jpg&quot;,&quot;../2026-12-21/details-02.jpg&quot;,&quot;../2026-12-21/details-03.jpg&quot;,&quot;../2026-12-21/details-04.jpg&quot;,&quot;../2026-12-21/details-05.jpg&quot;,&quot;../2026-12-21/details-06.jpg&quot;]'>写真アプリに保存（6点）</button>
  
  <textarea readonly id="c0">DETAILS.
細部まで、手を抜かない。

・Fabric：軽くて、すぐ乾く生地
・Reflective：夜でも光るライン
・Side Slit：動きやすい裾のスリット
・Waist &amp; Pocket：締めつけないウエストと、両サイドのポケット

3点セット ¥14,300（税込）
ご注文から約2〜3週間でお届け。色とサイズは、プロフィールのリンクから。

#ジムウェア #アスレジャー #セットアップ #トレーニングウェア #VXAPPAREL</textarea>
  <button type="button" data-c="c0">キャプションをコピー</button>
</section>
</main>
<script>
document.querySelectorAll('button[data-c]').forEach(function(b){b.onclick=function(){var t=document.getElementById(b.dataset.c);t.select();
(navigator.clipboard?navigator.clipboard.writeText(t.value):Promise.reject()).then(function(){b.textContent='コピーしました';},function(){document.execCommand('copy');b.textContent='コピーしました';});};});
document.querySelectorAll('button.save').forEach(function(b){b.onclick=async function(){
  var urls=JSON.parse(b.dataset.files);var label=b.textContent;b.textContent='準備中…';
  try{
    var files=await Promise.all(urls.map(async function(u){var r=await fetch(u);var bl=await r.blob();return new File([bl],u.split('/').pop(),{type:bl.type||(/mp4$/.test(u)?'video/mp4':'image/jpeg')});}));
    if(navigator.canShare&&navigator.canShare({files:files})){await navigator.share({files:files});b.textContent='保存できたら次へ';return;}
    files.forEach(function(f){var a=document.createElement('a');a.href=URL.createObjectURL(f);a.download=f.name;document.body.appendChild(a);a.click();a.remove();});
    b.textContent='ダウンロードしました（ファイルアプリ）';
  }catch(e){b.textContent=label;}
};});
</script></body></html>
